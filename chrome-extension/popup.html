<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Acrobat Pro PDF Extension</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>

  <header class="ext-header">
    <div class="brand">
      <div class="brand-icon">📄</div>
      <div class="brand-text">Acrobat<span>Pro</span></div>

    <div class="privacy-badge">🔒 100% Local</div>

  <main class="ext-main">

    </div>

  <footer class="ext-footer">
    <span>Acrobat Pro • 4u.ia.br</span>
  </footer>

  <script src="popup.js"></script>

</html>
