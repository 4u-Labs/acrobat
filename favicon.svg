<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140608"/>
      <stop offset="100%" stop-color="#2a0910"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Dark Background Plate -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="480" height="480" x="16" y="16" rx="96" fill="none" stroke="rgba(239, 68, 68, 0.25)" stroke-width="6"/>

  <!-- PDF Document Icon Shape -->
  <path d="M140 96 h140 l92 92 v228 c0 18 -14 32 -32 32 H140 c-18 0 -32 -14 -32 -32 V128 c0 -18 14 -32 32 -32 z" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)" stroke-width="8"/>
  <path d="M280 96 v92 h92" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="8" stroke-linejoin="round"/>

  <!-- Acrobat Curved Ribbon Emblem -->
  <path d="M 160 380 Q 200 240 256 160 Q 312 240 352 380 Q 300 330 256 330 Q 212 330 160 380 Z" fill="url(#redGrad)" filter="url(#glow)"/>
  <path d="M 190 320 Q 256 220 322 320 Q 280 290 256 290 Q 232 290 190 320 Z" fill="#ffffff" opacity="0.9"/>
</svg>
